<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카피바라 하루</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
/* VOICE: 느긋하고 다정한 카피바라가 옆에서 하루를 같이 보내주는 말투
   IDEA: 할 일 수첩 옆에 붙은 작은 연못 정원, 할 일 하나 = 카피바라 한 뼘
   PICTURE: 풀밭과 연못 위에 크게 그린 카피바라. 밤에는 별과 달, Zzz
   COLOUR and TYPE: 카피바라 갈색 + 풀빛 + 유자 노랑 포인트, Jua 제목 + Gowun Dodum 본문
   LAYOUT: 왼쪽 정원(그림), 오른쪽 할 일/꾸미기 탭. 좁으면 제목-정원-할 일 순서 */
:root{color-scheme:light dark;


--brown:#a8754a;--brown2:#7c5233;--yuzu:#ffb020;--yuzu2:#e8920a;
--sky:#cfeaf0;--hill:#b5dca0;--grass:#8cc47c;
--water:#8fd0d6;--sun:#ffd76a}
:root{--bg:#f6f8f1;--ink:#33261c;--soft:#7a6a5c;--card:#ffffff;--line:#e6e2d6;--ld0:#efe9dc;--ld1:#fff8e6;--ld2:#f1e7d8;--ld3:#eef6ea}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#151a17;--ink:#f1e9e0;--soft:#b9ab9d;--card:#1f2622;--line:#323b35;--ld0:#2c332e;--ld1:#2a2a22;--ld2:#33302a;--ld3:#26302a}}
:root[data-theme=dark]{--bg:#151a17;--ink:#f1e9e0;--soft:#b9ab9d;--card:#1f2622;--line:#323b35;--ld0:#2c332e;--ld1:#2a2a22;--ld2:#33302a;--ld3:#26302a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Gowun Dodum",system-ui,sans-serif;overflow-x:clip}
h1,h2,.jua{font-family:Jua,"Gowun Dodum",sans-serif;font-weight:400}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(18px,3vw,36px) max(4vw,14px) 48px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
h1{font-size:clamp(32px,5vw,46px);line-height:1.05;margin:0}
.sub{color:var(--soft);margin-top:4px}
.coin{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font:20px Jua,sans-serif;white-space:nowrap}
.coin svg{width:24px;height:24px}
.main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:2px solid var(--line);border-radius:26px;overflow:hidden}
.fig{position:relative;aspect-ratio:4/3;min-height:240px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}

.sky{fill:var(--sky)}.hill{fill:var(--hill)}.grass{fill:var(--grass)}.water{fill:var(--water)}.sun{fill:var(--sun)}
.stars{opacity:0;transition:opacity .8s}
.bg-onsen .pond,.bg-onsen #shadow{display:none}
.bg-sakura .hill{fill:#f3d3dc}
.bg-snow .sky{fill:#dbe7ef}.bg-snow .hill{fill:#e4eef4}.bg-snow .grass{fill:#f6f9fb}
.bg-xmas .sky{fill:#d6e4f0}.bg-xmas .hill{fill:#e4eef4}.bg-xmas .grass{fill:#f6f9fb}.bg-xmas .pond{display:none}
.tw{animation:tw 1.6s ease-in-out infinite}@keyframes tw{50%{opacity:.35}}
.bg-yuzu .hill{fill:#a8d48e}
.fall>*{animation:fall 7s linear infinite}
@keyframes fall{from{transform:translate(0,-30px)}to{transform:translate(-30px,350px)}}
.steam path{animation:steam 3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.steam path+path{animation-delay:1.4s}
@keyframes steam{0%{opacity:0;transform:translateY(10px) scaleY(.6)}40%{opacity:.8}100%{opacity:0;transform:translateY(-20px)}}
.night .sky{fill:#1c2440}.night .hill{fill:#2a3b45}.night .grass{fill:#2f4b44}.night .water{fill:#3a5a7a}.night .sun{fill:#f3ecc8}.night .stars{opacity:1}
.sky,.hill,.grass,.water,.sun{transition:fill .8s}
.st{fill:none;stroke:#33261c;stroke-width:4;stroke-linecap:round}.ik{fill:#33261c}
.anim{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
.sleeping .anim{animation-duration:5s}
.bounce{animation:bounce .55s ease}.squish{animation:squish .6s ease}.wiggle{animation:wiggle .5s ease}.hop{animation:hop .7s ease}.grow{animation:grow 1s ease}
@keyframes breathe{50%{transform:scale(1.015,1.03)}}
@keyframes bounce{30%{transform:translateY(-14%)}60%{transform:translateY(0) scale(1.06,.94)}}
@keyframes squish{35%{transform:scale(1.14,.82)}70%{transform:scale(.95,1.06)}}
@keyframes wiggle{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes hop{20%{transform:translateY(-8%)}45%{transform:translateY(0)}65%{transform:translateY(-5%)}}
@keyframes grow{30%{transform:scale(1.25)}60%{transform:scale(.95)}}
.zzz text{font:22px Jua,sans-serif;fill:#f3ecc8;animation:zz 3s ease-in-out infinite;opacity:0}
.zzz text:nth-child(2){animation-delay:1s}.zzz text:nth-child(3){animation-delay:2s}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-30px)}}
.bubble{position:absolute;top:16px;left:50%;transform:translateX(-50%) scale(.9);max-width:84%;background:#fff;color:#33261c;border-radius:18px;padding:10px 16px;font:18px/1.35 Jua,sans-serif;box-shadow:0 6px 0 rgba(51,38,28,.12);opacity:0;transition:.2s;pointer-events:none;text-align:center;text-wrap:balance}
.bubble.on{opacity:1;transform:translateX(-50%) scale(1)}
.heart{position:absolute;pointer-events:none;animation:heart 1.1s ease-out forwards}
@keyframes heart{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1.1)}}
.under{padding:16px 20px 20px;display:grid;gap:14px}
.stage{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:baseline}
.stage b{font:26px Jua,sans-serif;font-weight:400}.stage b small{font-size:17px;color:var(--soft)}.stage span{color:var(--soft);font-size:15px}
.rename{min-height:36px;padding:2px 10px;font-size:14px;border-radius:10px;margin-left:6px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0 16px}.chips button{min-height:38px;border-radius:99px;padding:4px 14px}
.modal input{width:100%;font:18px "Gowun Dodum",sans-serif;min-height:50px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px;text-align:center}
.item.wide{grid-column:span 2}
.bar{height:14px;border-radius:99px;background:var(--ld0);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yuzu),#ffc94d);border-radius:99px;transition:width .6s}
.row{display:flex;flex-wrap:wrap;gap:10px}
button{font:inherit;color:inherit;cursor:pointer;min-height:44px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:8px 16px}
button:focus-visible,input:focus-visible{outline:3px solid var(--yuzu);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--brown);border-color:var(--brown);color:#fff;font:19px Jua,sans-serif;flex:1}
.primary.wake{background:var(--yuzu);border-color:var(--yuzu);color:#33261c}
.letter{background:var(--ld1);border:2px dashed var(--yuzu);border-radius:18px;padding:14px 16px}
.letter small{display:block;color:var(--soft);font-size:13px;margin-bottom:4px}
.letter p{margin:0;font:18px/1.5 Jua,sans-serif}
.tabs{display:flex;border-bottom:2px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:none;font:19px Jua,sans-serif;color:var(--soft);padding:12px;border-bottom:4px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--yuzu)}
.pane{padding:18px 20px 22px}
.add{display:flex;gap:8px}
.add input{flex:1;font:16px "Gowun Dodum",sans-serif;min-height:48px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);padding:0 14px}
.add button{background:var(--ink);color:var(--bg);border-color:var(--ink);font:18px Jua,sans-serif;white-space:nowrap}
.prog{display:flex;justify-content:space-between;gap:10px;color:var(--soft);font-size:15px;margin:14px 2px 8px;flex-wrap:wrap}
.prog b{color:var(--ink);font-weight:400;font-family:Jua,sans-serif}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.task{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:16px;padding:4px 4px 4px 6px;background:var(--bg)}
.task .ck{border:0;background:none;padding:0;width:44px;flex:none;display:grid;place-items:center}
.task .ck i{width:28px;height:28px;border-radius:50%;border:3px solid var(--brown);display:grid;place-items:center;transition:.2s}
.task.done .ck i{background:var(--brown)}
.task .ck svg{width:16px;height:16px;opacity:0}.task.done .ck svg{opacity:1}
.task .tx{flex:1;overflow-wrap:anywhere;padding:8px 0}
.task.done .tx{text-decoration:line-through;color:var(--soft)}
.tag{font-size:12px;background:var(--ld2);color:var(--soft);border-radius:8px;padding:2px 7px;white-space:nowrap;margin-left:6px}
.task .later{border:0;background:var(--ld2);color:var(--soft);font-size:14px;min-height:34px;padding:2px 10px;border-radius:10px;white-space:nowrap;flex:none}
.task.postponed{opacity:.75;padding-left:16px;border-style:dashed}
.task .del{border:0;background:none;width:44px;padding:0;color:var(--soft);font-size:22px;line-height:1}
.empty{text-align:center;color:var(--soft);padding:26px 10px;border:2px dashed var(--line);border-radius:16px}
.asleep{opacity:.5;pointer-events:none}
.note{color:var(--soft);font-size:14px;margin:10px 2px 0}
.slot{font:18px Jua,sans-serif;margin:18px 0 8px}.slot:first-child{margin-top:0}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.item{border:2px solid var(--line);border-radius:18px;padding:10px;display:grid;gap:6px;background:var(--bg)}
.item.on{border-color:var(--yuzu);box-shadow:0 0 0 2px var(--yuzu) inset}
.item svg{width:100%;height:64px;background:var(--ld3);border-radius:12px}
.item b{font:16px Jua,sans-serif;font-weight:400}
.item button{min-height:40px;padding:4px 8px;font-size:15px}
.item .buy{background:var(--yuzu);border-color:var(--yuzu);color:#33261c}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;display:flex;gap:12px;align-items:center;transition:.3s;z-index:20;visibility:hidden;max-width:92vw;font:17px Jua,sans-serif}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast button{min-height:36px;padding:2px 12px;background:var(--yuzu);border:0;color:#33261c}
.modal{position:fixed;inset:0;background:rgba(20,16,12,.5);display:none;place-items:center;z-index:30;padding:16px}
.modal.on{display:grid}
.modal .box{background:var(--card);border-radius:24px;padding:24px;max-width:420px;width:100%;text-align:center}
.modal h2{margin:0 0 8px;font-size:26px;line-height:1.15}.modal p{margin:0 0 18px}
.modal .row button{flex:1 1 120px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>카피바라 하루</h1><div class="sub" id="date"></div></div>
    <div class="coin" aria-label="코인"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffb020"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#e8920a" stroke-width="2"/></svg><span id="cash">0</span></div>
  </header>
  <main class="main">
    <section class="card">
      <div class="fig" id="fig" role="button" tabindex="0" aria-label="카피바라 쓰다듬기">
        <svg viewBox="0 0 400 320" preserveAspectRatio="xMidYMax slice" id="scene"><defs><filter id="wob" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="5"/></filter></defs>
          <rect class="sky" width="400" height="320"/>
          <g class="stars" fill="#fff"><circle cx="40" cy="40" r="2"/><circle cx="110" cy="70" r="1.5"/><circle cx="180" cy="30" r="2"/><circle cx="250" cy="80" r="1.5"/><circle cx="70" cy="120" r="1.5"/><circle cx="380" cy="120" r="2"/><circle cx="220" cy="130" r="1.2"/></g>
          <circle class="sun" cx="330" cy="62" r="26"/>
          <path class="hill" d="M0 210 Q100 168 200 198 T400 186 V320 H0z"/>
          <path class="grass" d="M0 244 Q200 218 400 244 V320 H0z"/>
          <g class="pond"><ellipse class="water" cx="336" cy="282" rx="76" ry="18"/>
          <path d="M28 262 l4 -12 l4 12 M48 270 l3 -10 l3 10 M380 250 l4 -12 l4 12" stroke="#5f9a57" stroke-width="3" fill="none" stroke-linecap="round"/></g>
          <g id="bgBack"></g>
          <ellipse cx="180" cy="284" rx="80" ry="9" fill="rgba(0,0,0,.12)" id="shadow"/>
          <g id="capy" transform="translate(180 284)"></g>
          <g id="bgFront"></g>
        </svg>
        <div class="bubble" id="bubble"></div>
      </div>
      <div class="under">
        <div class="stage"><b id="stageName"></b><span id="stageNext"></span></div>
        <div class="bar"><i id="barFill"></i></div>
        <div id="letter"></div>
        <div class="row" id="dayBtns"></div>
      </div>
    </section>
    <section class="card">
      <div class="tabs" role="tablist">
        <button role="tab" id="tabTodo" aria-selected="true">오늘 할 일</button>
        <button role="tab" id="tabShop" aria-selected="false">꾸미기 상점</button>
      </div>
      <div class="pane" id="pane"></div>
    </section>
  </main>
</div>
<div class="toast" id="toast"><span id="toastTx"></span></div>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const KEY='capybara-day-v1';
const fresh=()=>({v:1,date:today(),phase:'awake',tasks:[],growth:0,cash:0,bonusDate:'',owned:[],eq:{},days:1,totalDone:0,msg:'',name:'',savedAt:0});
let S=fresh();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(fresh(),JSON.parse(r))}catch(e){}

const STAGES=[{min:0,name:'아기 카피바라',hs:1.32},{min:3,name:'꼬맹이 카피바라',hs:1.2},{min:8,name:'청소년 카피바라',hs:1.1},{min:15,name:'어른 카피바라',hs:1},{min:25,name:'대왕 카피바라',hs:1}];
const stageIdx=g=>{let i=0;STAGES.forEach((s,k)=>{if(g>=s.min)i=k});return i};
const SLOTS={bg:'배경',head:'모자',face:'얼굴',neck:'목',back:'등'};
const VB={head:'-112 -262 184 104',face:'-92 -178 144 60',neck:'-96 -104 152 84',back:'-112 -146 224 160',bg:'0 0 400 320'};
const drops=(fill,n,r,ry)=>`<g class="fall" fill="${fill}">`+Array.from({length:n},(_,i)=>`<ellipse cx="${20+(i*67)%380}" cy="0" rx="${r}" ry="${ry||r}" style="animation-delay:${-(i*1.37)%7}s;animation-duration:${6+(i%3)}s"/>`).join('')+'</g>';
const tree=(x,y,c,dots)=>`<rect x="${x-7}" y="${y}" width="14" height="${250-y}" rx="5" fill="#8c5f3a"/><g fill="${c}"><circle cx="${x}" cy="${y-8}" r="36"/><circle cx="${x-28}" cy="${y+12}" r="24"/><circle cx="${x+28}" cy="${y+10}" r="26"/></g>`+(dots?dots.map(([a,b])=>`<circle cx="${x+a}" cy="${y+b}" r="7" fill="#ffb020"/>`).join(''):'');
const BGS=[
 {id:'onsen',name:'노천 온천',price:0,cls:'bg-onsen',back:'<g fill="#9aa3a6" stroke="#5b3b24" stroke-width="3"><ellipse cx="40" cy="262" rx="40" ry="20"/><ellipse cx="352" cy="258" rx="44" ry="20"/></g><rect x="350" y="186" width="8" height="64" fill="#8c5f3a"/><rect x="300" y="186" width="8" height="64" fill="#8c5f3a"/><path d="M290 190 h78 l-8 -16 h-62z" fill="#c0473b"/><ellipse cx="200" cy="268" rx="178" ry="34" fill="#a6e0e6" stroke="#8f989b" stroke-width="10"/><path d="M60 262 q20 -6 40 0 M300 270 q20 -6 40 0 M110 278 q16 -5 32 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/>',front:'<g fill="#9aa3a6" stroke="#5b3b24" stroke-width="3"><ellipse cx="22" cy="312" rx="34" ry="16"/><ellipse cx="380" cy="314" rx="36" ry="16"/></g><g class="steam" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"><path d="M70 250 q-10 -16 0 -30 q10 -14 0 -30"/><path d="M320 246 q-10 -16 0 -30 q10 -14 0 -30"/></g>'},
 {id:'garden',name:'풀밭 정원',price:0,cls:'bg-garden',back:''},
 {id:'yuzufarm',name:'유자 과수원',price:120,cls:'bg-yuzu',back:tree(40,150,'#5c9e52',[[-14,-14],[12,0],[-30,16],[24,22]])+tree(362,160,'#4f9149',[[-10,-10],[16,10],[-24,18]])},

const LN=`fill="none" stroke="${K}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"`;
const OL=`stroke="${K}" stroke-width="5" stroke-linejoin="round"`;
const POSES={front:{f:1,r:0},turnL:{f:-1,r:0},turnR:{f:1,r:5},tilt:{f:1,r:7},tiltL:{f:-1,r:-6},up:{f:-1,r:-3},lie:{f:1,r:0}};
let pose='front';
function face(e){
  const le=e==='wink'?'normal':e,re=e==='wink'?'happy':e;
  const dash=(side,ex)=>{
    const [x1,y1,x2,y2]=side?[292,135,311,128]:[249,129,272,136];
    if(ex==='happy')return side?`<path d="M291 136 q10 -11 20 0" ${LN}/>`:`<path d="M249 136 q12 -11 23 0" ${LN}/>`;
    if(ex==='sleep')return side?`<path d="M291 130 q10 8 20 0" ${LN}/>`:`<path d="M249 130 q12 8 23 0" ${LN}/>`;
    if(ex==='wow')return `<circle cx="${side?301:260}" cy="132" r="6" fill="${K}"/>`;
    return `<path d="M${x1} ${y1} L${x2} ${y2}" ${LN}/>`;
  };
  const mouth=e==='wow'?`<ellipse cx="285" cy="176" rx="7" ry="9" fill="${K}"/>`
   :['happy','wink','smug'].includes(e)?`<path d="M268 168 q8 11 16 0 q8 11 16 0" ${LN}/>`
   :e==='sleep'?`<path d="M279 176 h12" ${LN}/>`
   :`<path d="M284 160 L285 188 q1 8 7 6" ${LN}/>`;
  const sm=e==='smug';
  return (sm?dash(0,'normal')+dash(1,'normal'):dash(0,le)+dash(1,re))+mouth;
}
function capy(){
  const g=S.growth,si=stageIdx(g),s=0.5+Math.min(g,30)/30*0.42,eq=S.eq,e=sleeping()?'sleep':expr;
  const lie=sleeping()||pose==='lie',P=POSES[lie?'lie':pose]||POSES.front;
  const it=sl=>eq[sl]&&IT[eq[sl]]?IT[eq[sl]].svg:'';
  const hot=['happy','wink'].includes(e)||(eq.bg||'onsen')==='onsen';
  const er=[1.25,1.15,1.08,1,1][si];
  const eye=e==='sleep'?`<path d="M122 99 q14 10 28 0" ${LN}/>`
   :e==='wow'?`<ellipse cx="136" cy="101" rx="${16*er}" ry="${14*er}" fill="${K}"/>`
   :`<ellipse cx="136" cy="101" rx="${14*er}" ry="${10*er}" fill="${K}" transform="rotate(14 136 101)"/>`;
  const blush=eq.face==='blush'?'':`<ellipse cx="200" cy="150" rx="20" ry="11" fill="#f2899a" opacity="${hot?.6:0}"/>`;
  const cap=sleeping()&&!eq.head?`<path d="M-74 -168 Q-20 -236 34 -168z" fill="#8ea6e8" ${OL}/><path d="M34 -168 Q60 -170 66 -140" stroke="${K}" stroke-width="15" fill="none" stroke-linecap="round"/><path d="M34 -168 Q60 -170 66 -140" stroke="#8ea6e8" stroke-width="9" fill="none" stroke-linecap="round"/><circle cx="66" cy="-136" r="9" fill="#fff" ${OL}/>`:'';
  const k=s*250/H;
  $('#shadow').setAttribute('rx',(lie?118:92)*s);
  const inner=`
   <g transform="translate(166 418) scale(1.6)">${it('back')}</g>
   <image href="${CAPY_IMG}" x="0" y="0" width="${W}" height="${H}"/>
   ${eye}${blush}${face(e)}
   <g transform="translate(281 140) scale(.62) translate(20 146)">${it('face')}</g>
   <g transform="translate(184 226) rotate(-3) scale(1.5) translate(20 75)">${it('neck')}</g>
   <g transform="translate(170 40) rotate(8) scale(1.75) translate(20 182)">${cap}${it('head')}</g>`;
  const tf=lie?`translate(${W/2} ${H}) rotate(${sleeping()?7:-12}) translate(${-W/2} ${-H})`:
    `translate(${W/2} ${H}) rotate(${P.r}) scale(${P.f} 1) translate(${-W/2} ${-H})`;
  const zz=sleeping()?`<g class="zzz"><text x="70" y="-150">Z</text><text x="86" y="-170">z</text><text x="100" y="-190">Z</text></g>`:'';
  return `<g transform="scale(${k}) translate(${-W/2} ${-H})"><g class="anim" id="anim"><g transform="${tf}">${inner}</g></g></g>${zz}`;
}
function drawCapy(a){
  $('#capy').innerHTML=capy();
  const bgId=S.eq.bg||'onsen',bg=BG[bgId]||BG.onsen,f=$('#fig');
  BGS.forEach(b=>f.classList.toggle(b.cls,bg.id===b.id));
  if(f.dataset.bg!==bg.id){f.dataset.bg=bg.id;$('#bgBack').innerHTML=bg.back||'';$('#bgFront').innerHTML=bg.front||''}
  $('#fig').classList.toggle('night',sleeping());$('#fig').classList.toggle('sleeping',sleeping());
  if(a){const el=$('#anim');el.classList.add(a);el.addEventListener('animationend',()=>el.classList.remove(a),{once:true})}
}
function say(t,ms){const b=$('#bubble');b.textContent=t;b.classList.add('on');clearTimeout(bubT);bubT=setTimeout(()=>b.classList.remove('on'),ms||2600)}
function hearts(n){const f=$('#fig');for(let i=0;i<n;i++){const h=document.createElement('div');h.className='heart';h.style.left=(42+Math.random()*16)+'%';h.style.top=(38+Math.random()*12)+'%';h.style.animationDelay=(i*.12)+'s';h.innerHTML='<svg width="22" height="20" viewBox="0 0 22 20"><path d="M11 19 C-6 8 3 -4 11 4 C19 -4 28 8 11 19z" fill="#ff6f8f"/></svg>';f.appendChild(h);setTimeout(()=>h.remove(),1500)}}
function react(e,a,line,ms,p){expr=e;pose=p||'front';drawCapy(a);if(line)say(line,ms);clearTimeout(exprT);exprT=setTimeout(()=>{expr='normal';pose='front';drawCapy()},p==='lie'?2400:1700)}

const TAPS=[['happy','bounce','뀨!','front'],['wink','wiggle','헤헷','tilt'],['smug','squish','...(무심)','turnL'],['happy','hop','쓰담쓰담 좋아','tiltL'],['wow','bounce','깜짝이야!','up'],['normal','wiggle','유자 먹고 싶다','turnR'],['smug','squish','온천 물 좋다~','turnL'],['happy','hop','오늘도 화이팅이야','up'],['wink','bounce','나 귀엽지?','tilt'],['happy','squish','기대기~','lie'],['sleep','squish','졸려... 꾸벅','tilt']];
function tap(){
  if(sleeping()){react('sleep','wiggle',pick(['쿨... 쿨...','음냐... 5분만...','zzz...','(뒤척뒤척)','유자... 많이... 음냐']));return}
  const now=Date.now();taps=taps.filter(t=>now-t<2500);taps.push(now);
  if(taps.length>=6){taps=[];react('wow','wiggle','그만 눌러어어!',0,'turnR');return}
  const left=S.tasks.filter(t=>!t.done).length;
  if(left&&Math.random()<.25){react('smug','hop',`할 일 ${left}개 남았어~ 나 키워줘`,0,'tiltL');return}
  const [e,a,l,po]=pick(TAPS);react(e,a,l,0,po);if(e==='happy'||e==='wink')hearts(3);
}

function cheer(){
  const T=S.tasks.filter(t=>!t.later),n=T.length,d=T.filter(t=>t.done).length;
  if(!n)return pick(['오늘은 아무 계획 없이 흘러간 날. 그것도 나쁘지 않아. 잘 자!','계획 없는 날도 필요해. 나랑 같이 푹 쉬자.']);
  if(d===n)return pick(['오늘 진짜 다 해냈네. 멋있다, 너. 푹 자고 내일 또 보자.','할 일 올클리어! 오늘의 너는 최고였어. 덕분에 나도 쑥 컸어.','다 끝냈다니 대단해. 따뜻한 온천에 몸 담그는 기분으로 쉬어.']);
  if(d/n>=.5)return pick(['많이 해냈어. 남은 건 내일의 우리가 하면 돼. 잘 자.','이 정도면 충분히 열심히 살았어. 오늘도 수고했어.']);
  if(d>0)return pick(['조금이라도 해낸 게 어디야. 오늘도 버틴 너, 고생했어.','천천히 가도 괜찮아. 카피바라도 원래 느긋해. 잘 자.']);
  return pick(['오늘은 쉬는 날이었나 봐. 그런 날도 있어야지. 내일 같이 해보자.','아무것도 못 한 날도 괜찮아. 내일은 하나만 같이 해보자.']);
}

let dbRef=null,saveT;
function save(){
  S.savedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(dbRef){clearTimeout(saveT);saveT=setTimeout(()=>{try{Promise.resolve(dbRef.set(JSON.parse(JSON.stringify(S)))).catch(()=>{})}catch(e){}},500)}
}

  $('#cash').textContent=S.cash;
  const i=stageIdx(S.growth),st=STAGES[i],nx=STAGES[i+1];
  $('#stageName').innerHTML=`${esc(nm())} <small>${st.name}</small><button class="rename" id="renameBtn">이름 바꾸기</button>`;
  if(nx){$('#stageNext').textContent=`다음 성장까지 할 일 ${nx.min-S.growth}개`;$('#barFill').style.width=((S.growth-st.min)/(nx.min-st.min)*100)+'%'}
  else{$('#stageNext').textContent=`다 컸어! 지금까지 ${S.totalDone}개 클리어`;$('#barFill').style.width='100%'}
  $('#letter').innerHTML=sleeping()&&S.msg?`<div class="letter"><small>잠들기 전 ${esc(nm())}의 한마디</small><p>${esc(S.msg)}</p></div>`:'';
  const newDay=S.date!==today();
  $('#dayBtns').innerHTML=sleeping()?`<button class="primary wake" id="wakeBtn">카피바라 깨우기 · 새 하루 시작</button>`:`<button class="primary" id="endBtn">오늘 하루 끝내기</button>`;
}
function renderPane(){
  $('#tabTodo').setAttribute('aria-selected',tab==='todo');$('#tabShop').setAttribute('aria-selected',tab==='shop');
  const p=$('#pane');
  if(tab==='todo'){
    const T=S.tasks.filter(t=>!t.later),LT=S.tasks.filter(t=>t.later);
    const n=T.length,d=T.filter(t=>t.done).length,bonus=Math.min(100,30+10*n);
    const bonusTx=S.bonusDate===S.date?'오늘 보너스 받음':(n?`전부 끝내면 +${bonus} 코인`:'');
    const ck='<i><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i>';
    const row=t=>`<li class="task${t.done?' done':''}"><button class="ck" data-ck="${t.id}" aria-label="${t.done?'완료 취소':'완료'}: ${esc(t.t)}">${ck}</button><span class="tx">${esc(t.t)}${t.carry?'<span class="tag">넘어온 일</span>':''}</span>${t.done?'':`<button class="later" data-later="${t.id}" aria-label="내일로 미루기: ${esc(t.t)}">내일로 미루기</button>`}<button class="del" data-del="${t.id}" aria-label="삭제: ${esc(t.t)}">×</button></li>`;
    const lrow=t=>`<li class="task postponed"><span class="tx">${esc(t.t)}</span><button class="later" data-back="${t.id}" aria-label="오늘로 되돌리기: ${esc(t.t)}">오늘로</button><button class="del" data-del="${t.id}" aria-label="삭제: ${esc(t.t)}">×</button></li>`;
    p.innerHTML=`<div class="${sleeping()?'asleep':''}">
     <form class="add" id="addForm"><input id="newTask" maxlength="60" placeholder="오늘 할 일을 적어줘" aria-label="할 일 입력" autocomplete="off"><button type="submit">추가</button></form>
     <div class="prog"><span><b>${d}/${n}</b> 완료</span><span>${bonusTx}</span></div>
     ${n?`<ul>${T.map(row).join('')}</ul>`:`<div class="empty">${LT.length?'오늘 할 일은 다 정리됐어.':'아직 할 일이 없어.<br>하나 끝낼 때마다 카피바라가 쑥쑥 자라.'}</div>`}
     ${LT.length?`<div class="slot">내일로 미룬 일 ${LT.length}개</div><ul>${LT.map(lrow).join('')}</ul>`:''}
    </div>${sleeping()?'<p class="note">카피바라가 자는 중이야. 깨우면 끝낸 일과 못 끝낸 일은 정리되고, 내일로 미룬 일만 남아.</p>':''}`;
  }else{
    p.innerHTML=Object.keys(SLOTS).map(sl=>`<div class="slot">${SLOTS[sl]}</div><div class="items">${ITEMS.filter(i=>i.slot===sl).map(i=>{
      const own=!i.price||S.owned.includes(i.id),on=sl==='bg'?(S.eq.bg||'onsen')===i.id:S.eq[sl]===i.id;
      const btn=on?(sl==='bg'?'<button disabled>사용 중</button>':`<button data-off="${sl}">벗기기</button>`):own?`<button data-on="${i.id}">입히기</button>`:`<button class="buy" data-buy="${i.id}"${S.cash<i.price?' disabled':''}>${i.price} 코인</button>`;
      return `<div class="item${on?' on':''}"><svg viewBox="${VB[sl]}"${sl==='bg'?' preserveAspectRatio="xMidYMax slice"':''}>${i.svg}</svg><b>${i.name}</b>${btn}</div>`}).join('')}</div>`).join('')+
      `<p class="note">하루 할 일을 전부 끝내면 코인을 받아. 할 일 개수만큼 더 받고, 하루 최대 100 코인이야. 온천과 풀밭 정원은 무료 배경이야.</p>`;
  }
}
function render(){renderTop();renderPane();drawCapy()}

function toast(t,undo){
  $('#toastTx').textContent=t;const el=$('#toast');
  el.querySelector('button')?.remove();
  if(undo){const b=document.createElement('button');b.textContent='되돌리기';b.onclick=()=>{undo();el.classList.remove('on')};el.appendChild(b)}
  el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),3200);
}
function modal(title,text,btns){
  $('#mbox').innerHTML=`<h2>${esc(title)}</h2><p>${esc(text)}</p><div class="row">${btns.map((b,i)=>`<button data-m="${i}" class="${b.main?'primary':''}">${esc(b.t)}</button>`).join('')}</div>`;
  $('#modal').classList.add('on');
  $('#mbox').querySelectorAll('[data-m]').forEach(el=>el.onclick=()=>{$('#modal').classList.remove('on');const f=btns[+el.dataset.m].f;if(f)f()});
  $('#mbox').querySelector('[data-m]').focus();
}

function askName(first){
  $('#mbox').innerHTML=`<h2>${first?'안녕! 내 이름을 지어줘':'이름 바꾸기'}</h2><p>${first?'오늘부터 같이 하루를 보낼 카피바라야.':'새 이름을 적어줘.'}</p>
   <form id="nameForm"><input id="nameIn" maxlength="10" placeholder="이름 (10자까지)" value="${esc(S.name)}" autocomplete="off" aria-label="카피바라 이름"><div class="chips">${NAMES.map(n=>`<button type="button" data-nm="${n}">${n}</button>`).join('')}</div><div class="row"><button type="submit" class="primary">이 이름으로 할래</button></div></form>`;
  $('#modal').classList.add('on');const inp=$('#nameIn');inp.focus();
  $('#mbox').querySelectorAll('[data-nm]').forEach(b=>b.onclick=()=>{inp.value=b.dataset.nm;inp.focus()});
  $('#nameForm').onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v){inp.focus();return}
    S.name=v;save();$('#modal').classList.remove('on');render();react('happy','hop',`${v}! 마음에 들어. 잘 부탁해`,3200);hearts(5)};
}
function toggle(id){
  if(sleeping())return;const t=S.tasks.find(x=>x.id===id);if(!t)return;
  const before=stageIdx(S.growth);t.done=!t.done;
  if(t.done){S.growth++;S.totalDone++}else{S.growth=Math.max(0,S.growth-1);S.totalDone=Math.max(0,S.totalDone-1)}
  save();render();
  if(!t.done){react('smug','squish','어라... 다시 줄었다');return}
  const after=stageIdx(S.growth);
  if(after>before){react('happy','grow',`${STAGES[after].name}로 자랐어!`,3200);hearts(6)}
  else{react('happy','bounce',pick(['해냈다!','쑥쑥!','잘했어, 최고야','한 뼘 컸다!','냠냠 성장 중']));hearts(2)}
  const TT=S.tasks.filter(x=>!x.later);if(TT.length&&TT.every(x=>x.done)&&S.bonusDate!==S.date){
    const b=Math.min(100,30+10*TT.length);S.cash+=b;S.bonusDate=S.date;save();render();
    setTimeout(()=>{modal('오늘 할 일 올클리어!',`보너스 ${b} 코인을 받았어. 꾸미기 상점에서 카피바라한테 선물해줘.`,[{t:'상점 가기',main:1,f:()=>{tab='shop';renderPane()}},{t:'나중에'}]);hearts(8)},700);
  }
}
function endDay(){
  const left=S.tasks.filter(t=>!t.done&&!t.later).length;
  const go=()=>{S.phase='sleep';S.msg=cheer();expr='normal';save();render();drawCapy('squish');say('잘 자... 오늘도 고생했어',3000)};
  if(left)modal('벌써 끝낼까?',`못 끝낸 일 ${left}개는 내일 사라져. 남기고 싶은 건 '내일로 미루기'를 눌러줘.`,[{t:'끝낼래',main:1,f:go},{t:'조금 더 할래'}]);
  else go();
}
function wake(){
  const newDay=S.date!==today();
  const cleared=S.tasks.filter(t=>t.done).length;
  const carry=S.tasks.filter(t=>t.later).map(t=>({...t,later:false,done:false,carry:true}));
  S.tasks=carry;S.phase='awake';S.msg='';
  if(newDay){S.date=today();S.days++}
  save();render();
  react('happy','hop',carry.length?`좋은 아침! 미뤄둔 일 ${carry.length}개 가져왔어`:'좋은 아침! 오늘은 뭐 할 거야?',3400);
}

$('#fig').addEventListener('click',tap);
$('#fig').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap()}});
$('#tabTodo').onclick=()=>{tab='todo';renderPane()};
$('#tabShop').onclick=()=>{tab='shop';renderPane()};
$('#stageName').addEventListener('click',e=>{if(e.target.closest('#renameBtn'))askName(false)});
$('#dayBtns').addEventListener('click',e=>{if(e.target.closest('#endBtn'))endDay();if(e.target.closest('#wakeBtn'))wake()});
$('#pane').addEventListener('submit',e=>{
  e.preventDefault();const inp=$('#newTask'),v=inp.value.trim();if(!v||sleeping())return;
  if(S.tasks.length>=30){toast('할 일은 30개까지만 적을 수 있어');return}
  S.tasks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:v,done:false});save();renderPane();renderTop();
  $('#newTask').focus();if(Math.random()<.5)react('normal','hop',pick(['오, 그거 하는구나','좋아, 같이 해보자','적었다! 이제 하기만 하면 돼']));
});
$('#pane').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ck)toggle(b.dataset.ck);
  if(b.dataset.later&&!sleeping()){const t=S.tasks.find(x=>x.id===b.dataset.later);if(t){t.later=true;save();render();react('smug','squish','내일의 우리가 할 거야',2400,'turnL');const TT=S.tasks.filter(x=>!x.later);if(TT.length&&TT.every(x=>x.done)&&S.bonusDate!==S.date){const bn=Math.min(100,30+10*TT.length);S.cash+=bn;S.bonusDate=S.date;save();render();setTimeout(()=>modal('오늘 할 일 올클리어!',`보너스 ${bn} 코인을 받았어.`,[{t:'좋아',main:1}]),900)}}}
  if(b.dataset.back&&!sleeping()){const t=S.tasks.find(x=>x.id===b.dataset.back);if(t){t.later=false;save();render();react('happy','hop','좋아, 오늘 해보자!',2400)}}
  if(b.dataset.del){const i=S.tasks.findIndex(t=>t.id===b.dataset.del);if(i<0)return;const [t]=S.tasks.splice(i,1);save();render();toast('할 일을 지웠어',()=>{S.tasks.splice(i,0,t);save();render()})}
  if(b.dataset.buy){const it=IT[b.dataset.buy];if(S.cash<it.price)return;S.cash-=it.price;S.owned.push(it.id);S.eq[it.slot]=it.id;save();render();react('happy','grow',`${it.name}! 고마워!`,2800);hearts(5)}
  if(b.dataset.on){const it=IT[b.dataset.on];S.eq[it.slot]=it.id;save();render();react('wink','bounce',pick(['어때, 잘 어울려?','멋쟁이 카피바라','이거 마음에 들어']))}
  if(b.dataset.off){delete S.eq[b.dataset.off];save();render();react('normal','wiggle','가벼워졌다')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('on')});
setInterval(()=>{if(!sleeping()&&expr==='normal'&&!document.hidden){expr='sleep';drawCapy();setTimeout(()=>{if(expr==='sleep'){expr='normal';drawCapy()}},160)}},3800);
setInterval(()=>{if(S.date!==today()&&!sleeping()){rollover();save();render()}},60000);

rollover();render();
if(!S.name)setTimeout(()=>{if(!S.name)askName(true)},900);

async function connect(tries){
  try{
    const c=window.claude;if(!c||!c.use){if(tries<5)setTimeout(()=>connect(tries+1),800);return}
    const db=await c.use('db'),user=await c.use('user');if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.collection('data/users/'+id).doc('capy');
    const snap=await Promise.race([Promise.resolve(ref.get()),new Promise(r=>setTimeout(()=>r('__t'),10000))]);
    if(snap==='__t')return;
    let d=snap;if(d&&typeof d.data==='function')d=d.data();else if(d&&d.data&&!d.tasks)d=d.data;
    dbRef=ref;
    if(d&&Array.isArray(d.tasks)&&(d.savedAt||0)>(S.savedAt||0)){S=Object.assign(fresh(),d);rollover();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(S.name&&$('#nameForm'))$('#modal').classList.remove('on');render()}
    else if(S.savedAt)save();
  }catch(e){}
}
connect(0);
}
</script>
</body>
</html>
